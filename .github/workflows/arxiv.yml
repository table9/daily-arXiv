name: arXiv-daily

on:
  schedule:
    # Avoid the busy start of the hour; this mitigates delay, not a scheduler repair.
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "One announcement date (YYYY-MM-DD); empty defaults to UTC today"
        type: string
        default: ""
      start_date:
        description: "First announcement date (inclusive); do not combine with date"
        type: string
        default: ""
      end_date:
        description: "Last announcement date (inclusive); defaults to start_date"
        type: string
        default: ""
      dry_run:
        description: "Plan only: no crawling, AI calls, or result changes"
        type: boolean
        default: false
      publish:
        description: "Commit completed dates to the default branch (manual runs only)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/arxiv.yml"
      - "scripts/**"
      - "daily_arxiv/**"
      - "ai/**"
      - "to_md/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
      - name: Offline regression tests
        run: .venv/bin/python -m unittest discover -s tests -v

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    concurrency:
      group: arxiv-daily-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
      - name: Validate publication target
        if: github.event_name == 'schedule' || inputs.publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - name: Crawl, deduplicate, enhance, and render selected dates
        id: harvest
        env:
          TARGET_DATE: ${{ inputs.date }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          DRY_RUN: ${{ inputs.dry_run }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LANGUAGE: ${{ vars.LANGUAGE || 'Chinese' }}
          CATEGORIES: ${{ vars.CATEGORIES }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'deepseek-chat' }}
          ARXIV_HTTP_DIAGNOSTICS_FILE: ${{ runner.temp }}/arxiv-http-errors.jsonl
        run: |
          args=(--date "$TARGET_DATE" --start-date "$START_DATE" --end-date "$END_DATE"
                --work-dir "$RUNNER_TEMP/arxiv-backfill" --report "$RUNNER_TEMP/arxiv-report.json")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          .venv/bin/python scripts/run_dates.py "${args[@]}"
      - name: Commit and push completed dates
        # A failed date stops the range; earlier fully validated dates remain recoverable.
        if: >-
          !cancelled() && (steps.harvest.outcome == 'success' || steps.harvest.outcome == 'failure') &&
          inputs.dry_run != true && (github.event_name == 'schedule' || inputs.publish)
        env:
          COMMIT_EMAIL: ${{ vars.EMAIL }}
          COMMIT_NAME: ${{ vars.NAME }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.email "$COMMIT_EMAIL"
          git config user.name "$COMMIT_NAME"
          git add -- data md assets/file-list.txt
          if [ -d assets/harvest-status ]; then git add -- assets/harvest-status; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update: dated arXiv papers"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
          done
      - name: Upload recovery report, staged outputs, and HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/arxiv-report.json
            ${{ runner.temp }}/arxiv-backfill/
            ${{ runner.temp }}/arxiv-http-errors.jsonl
          if-no-files-found: ignore
          retention-days: 30
