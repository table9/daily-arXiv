name: Backfill September 23-25 papers
on:
  push:
    branches: [backfill-arxiv-20260923-25]
    paths: ['scripts/backfill-20260923-25.*', '.github/workflows/backfill-20260923-25.yml']
permissions:
  contents: write
concurrency:
  group: backfill-arxiv-20260923-25
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install existing dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
      - name: Recover metadata and Chinese summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        run: .venv/bin/python -u scripts/backfill-20260923-25.py
      - name: Preserve recovery output on isolated branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ md/ assets/
          if ! git diff --cached --quiet; then
            git commit -m "data: recover September 23-25 papers"
            git push origin HEAD:backfill-arxiv-20260923-25
          fi
